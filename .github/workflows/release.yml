name: Build and publish patcher
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile standalone EXE
        shell: pwsh
        run: ./build.ps1
      - name: Prepare release files
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath dist/Titanfall2VR-QuestPatch.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath dist/SHA256.txt -Value "$hash  Titanfall2VR-QuestPatch.exe" -Encoding ascii
          Compress-Archive -LiteralPath dist/Titanfall2VR-QuestPatch.exe,dist/README.txt,dist/SHA256.txt -DestinationPath dist/Titanfall2VR-QuestPatch.zip
      - name: Publish release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v1.2.0' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; keeping its published files unchanged."
            exit 0
          }
          gh release create $tag dist/Titanfall2VR-QuestPatch.exe dist/Titanfall2VR-QuestPatch.zip dist/README.txt dist/SHA256.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Titanfall 2 VR Апдейт управления $tag" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

